<div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
  @for (card of cards; track card.key) {
    <button
      type="button"
      z-card
      class="text-left transition-colors hover:border-primary/40 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
      [class.border-primary]="isActive(card)"
      [class.ring-1]="isActive(card)"
      [class.ring-primary]="isActive(card)"
      [attr.aria-pressed]="isActive(card)"
      [attr.aria-label]="'Filter by ' + card.label"
      (click)="onSelect(card)"
    >
      <div z-card-content class="flex flex-col gap-1 py-4">
        <span class="text-sm text-muted-foreground">{{ card.label }}</span>
        @if (loading()) {
          <z-skeleton class="h-8 w-12 rounded" />
        } @else {
          <span class="text-3xl font-semibold tabular-nums" [class]="card.accent">{{ count(card.key) }}</span>
        }
      </div>
    </button>
  }
</div>
